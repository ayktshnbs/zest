# Render blueprint for the Zest Home Express API.
# Create the service: Render dashboard → New → Blueprint → connect the repo.
# `sync: false` vars are prompted on first deploy (paste the values from chat).
services:
  - type: web
    name: zest-api
    runtime: node
    rootDir: server
    plan: free
    branch: main
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: PG_SSL
        value: "true"
      - key: JWT_ACCESS_TTL
        value: 15m
      - key: JWT_REFRESH_TTL
        value: 7d
      - key: CREEM_API_BASE
        value: https://api.creem.io
      # Secrets / environment-specific — entered in the Render dashboard:
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: CSRF_SECRET
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: PASSWORD_RESET_URL
        sync: false
      - key: LOGIN_URL
        sync: false
      - key: EMAIL_VERIFICATION_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CREEM_API_KEY
        sync: false
      - key: CREEM_WEBHOOK_SECRET
        sync: false
      - key: CREEM_SUCCESS_URL
        sync: false
      - key: CREEM_CANCEL_URL
        sync: false
